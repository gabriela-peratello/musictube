<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
    background-color: #1a1a1a; /* Preto quase fosco */
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

#login-container {
    background-color: #333333; /* Cinza mediano escuro */
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    text-align: center;
    width: 300px;
}

h2 {
    color: #eeeeee; /* Cinza bem claro */
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #444;
    border-radius: 6px;
    background-color: #444444; /* Cinza médio */
    color: white;
    box-sizing: border-box; /* Garante que o padding não quebre a largura */
}

input::placeholder {
    color: #888;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    background-color: #555555; /* Cinza destaque */
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}

button:hover {
    background-color: #777777; /* Tom mais claro no hover */
}

#mensagem {
    margin-top: 15px;
    font-size: 14px;
    min-height: 1em;
}
    </style>
</head>
<body>
    <div id="login-container">
        <h2>Login</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="logar()">Entrar</button>
        <p id="mensagem"></p>
    </div>
</body>
</html>
